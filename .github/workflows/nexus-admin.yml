# NEXUS Admin — the two changes nothing inside NEXUS may make, run by the owner
# from the Actions tab with the deploy pipeline's service account, so nobody needs a
# key file on a laptop. Same pattern as event-export.yml.
#
#   register-domain  add an email domain to config/domains, so leads can add
#                    colleagues at that institution (scripts/bootstrap-config.cjs,
#                    additive: it never removes a domain already there)
#   transfer-team    hand a team to a new lead (scripts/transfer-team.cjs)
#   mark-verified    confirm an account's address on the owner's word, when the
#                    verification email never arrives (scripts/mark-verified.cjs)
#   change-email     move one account to a new address, keeping the account
#                    (scripts/change-email.cjs; needs the service account to hold
#                    the Firebase Authentication Admin role)
#
# EVERY RUN IS A PREVIEW unless "apply" is ticked. Read the preview in the job log,
# then run it again with "apply" ticked to make the change.
name: NEXUS Admin
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to do'
        required: true
        type: choice
        options:
          - register-domain
          - transfer-team
          - change-email
          - mark-verified
      domain:
        description: 'register-domain: the email domain, e.g. kkh.com.sg'
        required: false
        default: 'kkh.com.sg'
      team:
        description: 'transfer-team: the team id'
        required: false
        default: 'kkh-sport-exercise-medicine'
      newLeadEmail:
        description: 'transfer-team: the new lead''s email (they must already be in the team)'
        required: false
      previousLeadBecomes:
        description: 'transfer-team: what the outgoing lead becomes'
        required: false
        type: choice
        default: viewer
        options:
          - viewer
          - staff
          - lead
      currentEmail:
        description: 'change-email: the account''s current address'
        required: false
      newEmail:
        description: 'change-email: the address it should move to. mark-verified: the address to confirm'
        required: false
      apply:
        description: 'Apply the change. Leave unticked to preview only.'
        required: false
        type: boolean
        default: false

jobs:
  admin:
    runs-on: ubuntu-latest
    # One admin change at a time, and never alongside a deploy of the same project.
    concurrency: nexus-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the admin SDK (functions/ holds it)
        working-directory: ./functions
        run: npm ci --omit=dev
      # ⚠️ THIS REPOSITORY IS PUBLIC, AND SO IS EVERY RUN'S LOG. GitHub prints a
      #    step's `env:` block at the top of its log, so the new lead's address is
      #    NOT passed through `env:`. It is read from the event file inside the step
      #    and masked before anything prints; the scripts print only masked values.
      - name: Run
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        run: |
          set -euo pipefail
          umask 077
          input() { jq -r --arg k "$1" '.inputs[$k] // empty' "$GITHUB_EVENT_PATH"; }
          TASK="$(input task)"
          DOMAIN="$(input domain)"
          TEAM="$(input team)"
          NEW_LEAD="$(input newLeadEmail)"
          PREVIOUS_BECOMES="$(input previousLeadBecomes)"
          APPLY="$(input apply)"
          CURRENT_EMAIL="$(input currentEmail)"
          NEW_EMAIL="$(input newEmail)"
          for v in "$NEW_LEAD" "$CURRENT_EMAIL" "$NEW_EMAIL"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          KEY="$RUNNER_TEMP/sa.json"
          printf '%s' "$GCP_SA_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          WRITE_FLAG=""
          if [ "$APPLY" = "true" ]; then WRITE_FLAG="--write"; fi
          export NODE_PATH=functions/node_modules
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY"
          case "$TASK" in
            register-domain)
              node scripts/bootstrap-config.cjs --merge-domains --domain "$DOMAIN" $WRITE_FLAG
              ;;
            transfer-team)
              node scripts/transfer-team.cjs --team "$TEAM" --to "$NEW_LEAD" \
                --previous-lead-becomes "$PREVIOUS_BECOMES" $WRITE_FLAG
              ;;
            change-email)
              node scripts/change-email.cjs --from "$CURRENT_EMAIL" --to "$NEW_EMAIL" $WRITE_FLAG
              ;;
            mark-verified)
              node scripts/mark-verified.cjs --email "$NEW_EMAIL" $WRITE_FLAG
              ;;
            *)
              echo "Unknown task: $TASK"; exit 1
              ;;
          esac
